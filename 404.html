    <!-- Halyard Display — same Adobe Fonts kit as launchpad.build -->
    <link rel="stylesheet" href="https://use.typekit.net/xog3vbp.css" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("launchpad-workboard-theme-v2");
          if (t !== "light" && t !== "dark") t = "light";
          document.documentElement.classList.toggle("dark", t === "dark");
          document.documentElement.classList.toggle("light", t === "light");
        } catch (e) {
          document.documentElement.classList.add("light");
        }
      })();
    </script>
